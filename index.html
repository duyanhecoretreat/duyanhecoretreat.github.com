<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Retreat 360°</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#panorama {
    width: 100%;
    height: 100%;
}
.pnlm-render-container {
    filter: brightness(1.15);
}
#locationBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: white;
    border: 1px solid rgba(255,255,255,0.5);
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

#locationMenu {
    display: none;
    position: fixed;
    top: 70px;
    left: 20px;
    z-index: 9999;
    width: 240px;
    max-height: 70vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.88);
    border-radius: 10px;
    padding: 8px;
}

.locationItem {
    color: white;
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
}

.locationItem:hover {
    background: rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div id="panorama"></div>

<button id="locationBtn" onclick="toggleMenu()">
📍 CHỌN VỊ TRÍ
</button>

<div id="locationMenu">
    <div class="locationItem" onclick="goTo('scene1')">ECO BAZAAR</div>
    <div class="locationItem" onclick="goTo('scene2')">MUA HA</div>
    <div class="locationItem" onclick="goTo('scene3')">SKY RETREAT</div>
    <div class="locationItem" onclick="goTo('scene4')">CONG VAO</div>
    <div class="locationItem" onclick="goTo('scene5')">2 TOA CHUA BAN</div>
    <div class="locationItem" onclick="goTo('scene6')">FOREST ONSEN</div>
    <div class="locationItem" onclick="goTo('scene7')">MUA THU 1</div>
    <div class="locationItem" onclick="goTo('scene8')">HO THIEN NGA</div>
    <div class="locationItem" onclick="goTo('scene9')">BIET THU DAO</div>
    <div class="locationItem" onclick="goTo('scene10')">MUA XUAN</div>
    <div class="locationItem" onclick="goTo('scene11')">MUA THU 2</div>
</div>

<script>

const viewer = pannellum.viewer('panorama', {

"default": {
    "firstScene": "scene1",
    "autoLoad": true,
    "autoRotate": -2,
    "sceneFadeDuration": 700
},

"scenes": {

"scene1": {
    "title": "ECO BAZAAR",
    "type": "equirectangular",
    "panorama": "360-01.jpg"
},

"scene2": {
    "title": "MUA HA",
    "type": "equirectangular",
    "panorama": "360-02.jpg"
},

"scene3": {
    "title": "SKY RETREAT",
    "type": "equirectangular",
    "panorama": "360-03.jpg"
},

"scene4": {
    "title": "CONG VAO",
    "type": "equirectangular",
    "panorama": "360-04.jpg"
},

"scene5": {
    "title": "2 TOA CHUA BAN",
    "type": "equirectangular",
    "panorama": "360-05.jpg"
},

"scene6": {
    "title": "FOREST ONSEN",
    "type": "equirectangular",
  "panorama": "360-06.jpg"
},

"scene7": {
    "title": "MUA THU 1",
    "type": "equirectangular",
    "panorama": "360-07.jpg"
},

"scene8": {
    "title": "HO THIEN NGA",
    "type": "equirectangular",
    "panorama": "360-08.jpg"
},

"scene9": {
    "title": "BIET THU DAO",
    "type": "equirectangular",
    "panorama": "360-09.jpg"
},

"scene10": {
    "title": "MUA XUAN",
    "type": "equirectangular",
    "panorama": "360-10.jpg"
},

"scene11": {
    "title": "MUA THU 2",
    "type": "equirectangular",
    "panorama": "360-11.jpg"
}

}
});

function toggleMenu() {
    const menu = document.getElementById("locationMenu");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

function goTo(sceneId) {
    viewer.loadScene(sceneId);
    document.getElementById("locationMenu").style.display = "none";
}

</script>

</body>
</html>
